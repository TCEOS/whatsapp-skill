name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Test offline behavior
        run: bun test scripts/tests
      - name: Validate skills and publication contents
        run: |
          python scripts/verify-skill.py
          python scripts/check-publication.py
          python scripts/tests/install.test.py
      - name: Run synthetic demo
        run: bun assets/demo.mjs
